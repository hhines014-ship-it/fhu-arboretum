<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive arboretum map for Freed-Hardeman University. Explore campus trees, learn about them, and navigate with Google or Apple Maps.">
  <title>Freed-Hardeman University Arboretum</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root {
      --green: #022b09;
      --green-light: #179119;
      --paper: #d7af0f;
      --line: #dba913;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #1f2937;
      background: #fff;
    }

    .app {
      display: grid;
      grid-template-columns: 400px 1fr;
      height: 100vh;
      height: 100dvh;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: #fff;
      border-right: 1px solid var(--line);
    }

    .brand {
      padding: 16px;
      color: #fff;
      background: linear-gradient(135deg, #30010a, #7c0a13 60%, #550319);
    }

    .brand h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.25;
    }

    .brand p {
      margin: 4px 0 0;
      font-size: 12px;
      opacity: 0.9;
    }

    .toolbar {
      padding: 10px;
      border-bottom: 1px solid var(--line);
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      background: #550304;
    }

    .content {
      flex: 1;
      overflow: auto;
      min-height: 0;
      padding: 12px;
    }

    .map-container {
      position: relative;
      min-height: 0;
    }

    .map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .picker-banner {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: var(--green);
      color: #fff;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 13px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      pointer-events: none;
    }

    .btn {
      appearance: none;
      border: 1px solid #b7c4b9;
      background: #fff;
      color: #1f2937;
      padding: 7px 10px;
      border-radius: 7px;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .btn:hover {
      background: #f0f4f0;
    }

    .btn-primary {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--green-light);
    }

    .btn-small {
      padding: 4px 8px;
      font-size: 12px;
    }

    .btn-danger {
      background: #fff1f2;
      border-color: #fecdd3;
      color: #9f1239;
    }

    .btn-danger:hover {
      background: #ffe4e6;
    }

    .search {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .form {
      background: var(--paper);
      border: 1px solid #d8d2c4;
      border-radius: 10px;
      padding: 12px;
    }

    .form-title {
      margin: 0 0 10px;
      font-size: 16px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin: 10px 0 4px;
      color: #374151;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 8px 9px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font: inherit;
      background: #fff;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .form-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .tree-card {
      border: 1px solid #d8d2c4;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 10px;
      background: #fff;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .tree-card h3,
    .popup h3 {
      margin: 0;
      font-size: 15px;
    }

    .species {
      color: #57534e;
      font-style: italic;
      font-size: 13px;
      margin-top: 2px;
    }

    .badges {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: 999px;
      background: #e7f0e8;
      color: #14532d;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }

    .badge-condition-excellent {
      background: #dcfce7;
      color: #166534;
    }

    .badge-condition-good {
      background: #ecfdf5;
      color: #065f46;
    }

    .badge-condition-fair {
      background: #fef3c7;
      color: #92400e;
    }

    .badge-condition-poor {
      background: #fee2e2;
      color: #991b1b;
    }

    .badge-condition-unknown {
      background: #f3f4f6;
      color: #4b5563;
    }

    .loc,
    .desc {
      margin: 6px 0 0;
      font-size: 13px;
      line-height: 1.35;
    }

    .desc {
      white-space: pre-line;
    }

    .coords {
      margin-top: 8px;
      font-size: 11px;
      color: #6b7280;
    }

    .actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .empty {
      padding: 18px 8px;
      color: #57534e;
      font-size: 14px;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-top: 1px solid var(--line);
      background: #faf9f5;
      font-size: 12px;
      color: #57534e;
    }

    .admin-toggle {
      border: 0;
      background: transparent;
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .admin-toggle:hover {
      text-decoration: underline;
    }

    .hidden {
      display: none !important;
    }

    .tree-div-icon {
      background: transparent;
      border: 0;
    }

    .tree-pin {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--green);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
      display: grid;
      place-items: center;
      font-size: 16px;
    }

    .leaflet-popup-content {
      margin: 10px;
    }

    .leaflet-popup-content .popup {
      max-width: 250px;
    }

    .popup img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin-top: 8px;
    }

    .popup .actions {
      margin-top: 10px;
    }

    code {
      background: #f3f4f6;
      padding: 1px 4px;
      border-radius: 4px;
      font-size: 11px;
    }

    @media (max-width: 900px) {
      .app {
        display: block;
        height: auto;
      }

      .sidebar {
        max-height: 55vh;
        overflow: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .map-container {
        height: 45vh;
      }

      .map {
        position: relative;
        inset: auto;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <h1>Freed-Hardeman University Arboretum</h1>
        <p>Interactive Campus Tree Map · Henderson, Tennessee</p>
      </div>

      <div class="toolbar">
        <button id="btnAdd" class="btn btn-primary hidden">Add Tree</button>
        <button id="btnExport" class="btn hidden">Export</button>
        <button id="btnImport" class="btn hidden">Import</button>
        <button id="btnResetPublished" class="btn hidden">Reset to Published</button>
        <button id="btnCenter" class="btn">Center Campus</button>
        <button id="btnFit" class="btn">Fit Trees</button>
      </div>

      <div class="content">
        <section id="viewForm" class="form hidden" aria-live="polite">
          <h2 class="form-title" id="formTitle">Add Tree</h2>

          <label for="fName">Common name</label>
          <input id="fName" type="text" placeholder="Red Maple">

          <label for="fSpecies">Scientific name</label>
          <input id="fSpecies" type="text" placeholder="Acer rubrum">

          <div class="row">
            <div>
              <label for="fTag">Type</label>
              <select id="fTag">
                <option value="tree">Tree</option>
                <option value="conifer">Conifer</option>
                <option value="broadleaf">Broadleaf</option>
                <option value="palm">Palm</option>
                <option value="shrub">Shrub</option>
                <option value="vine">Vine</option>
                <option value="fern">Fern</option>
                <option value="other">Other</option>
              </select>
            </div>

            <div>
              <label for="fCondition">Condition</label>
              <select id="fCondition">
                <option value="excellent">Excellent</option>
                <option value="good">Good</option>
                <option value="fair">Fair</option>
                <option value="poor">Poor</option>
                <option value="unknown" selected>Unknown</option>
              </select>
            </div>
          </div>

          <label for="fLocation">Location notes</label>
          <input id="fLocation" type="text" placeholder="North lawn, near administration building">

          <label for="fDescription">Description / learning info</label>
          <textarea id="fDescription" placeholder="Fall color, bark, flowers, historical notes, management notes..."></textarea>

          <label for="fPhoto">Photo URL (optional)</label>
          <input id="fPhoto" type="url" placeholder="https://example.com/tree.jpg">

          <div class="row">
            <div>
              <label for="fLat">Latitude</label>
              <input id="fLat" type="number" step="any" placeholder="36.302700">
            </div>
            <div>
              <label for="fLng">Longitude</label>
              <input id="fLng" type="number" step="any" placeholder="-86.603700">
            </div>
          </div>

          <div class="row">
            <div style="grid-column: 1 / -1;">
              <button id="fPick" type="button" class="btn">Click Map to Set Location</button>
            </div>
          </div>

          <div class="form-actions">
            <button id="fSave" type="button" class="btn btn-primary">Save</button>
            <button id="fCancel" type="button" class="btn">Cancel</button>
            <button id="fDelete" type="button" class="btn btn-danger hidden">Delete</button>
          </div>
        </section>

        <section id="viewList">
          <input id="search" class="search" type="search" placeholder="Search tree name, species, or notes">
          <div id="list"></div>
        </section>
      </div>

      <div class="footer">
        <span>Public data loads from <code>trees.json</code>.</span>
        <button id="adminToggle" type="button" class="admin-toggle">Admin mode: off</button>
      </div>
    </aside>

    <div class="map-container">
      <div id="map" class="map" role="application" aria-label="Arboretum map"></div>
      <div id="pickerBanner" class="picker-banner hidden">Click the map to set the tree location</div>
    </div>
  </div>

  <input type="file" id="importFile" accept="application/json,.json" class="hidden" aria-hidden="true">

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    'use strict';

    const SUPABASE_URL = 'https://yaqqiyezxrvibxecjsms.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_secret_Di7xNWjFQs9Vxj-isWVS8A_7WQv5Bhd';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const $ = (id) => document.getElementById(id);

    const config = {
      center: [35.44026, -88.63750],
      zoom: 17
    };

    const DEFAULT_TREES = [
      {
        id: 'sample-1',
        name: 'Sample Oak — replace me',
        species: 'Quercus sp.',
        tag: 'tree',
        condition: 'unknown',
        location: 'Near central lawn',
        description: 'Sample record for testing. Replace with a real tree record and verified GPS point.',
        photo: '',
        lat: config.center[0] - 0.00015,
        lng: config.center[1] - 0.0002
      },
      {
        id: 'sample-2',
        name: 'Sample Ginkgo — replace me',
        species: 'Ginkgo biloba',
        tag: 'tree',
        condition: 'unknown',
        location: 'Near walkway',
        description: 'Ginkgo is a living fossil with fan-shaped leaves and bright yellow fall color.',
        photo: '',
        lat: config.center[0] + 0.00012,
        lng: config.center[1] + 0.00025
      },
      {
        id: 'sample-3',
        name: 'Sample Red Maple — replace me',
        species: 'Acer rubrum',
        tag: 'tree',
        condition: 'unknown',
        location: 'North side sample',
        description: 'Red maple is common in Middle Tennessee with red flowers, green leaves, and red fall color.',
        photo: '',
        lat: config.center[0] - 0.00005,
        lng: config.center[1] + 0.00035
      }
    ];

    const map = L.map('map').setView(config.center, config.zoom);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      maxZoom: 19
    }).addTo(map);

    let publishedTrees = [];
    let trees = [];
    let adminMode = false;
    const markers = new Map();
    let previewMarker = null;
    let picking = false;
    let editingId = null;

    function uid() {
      return crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    }

    function escapeHtml(value = '') {
      return String(value).replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[ch]));
    }

    function getTreeArray(data) {
      if (Array.isArray(data)) return data;
      if (data && Array.isArray(data.trees)) return data.trees;
      return [];
    }

    function normalizeTree(t = {}) {
      const lat = parseFloat(t.lat ?? t.latitude ?? t.Lat ?? t.LAT ?? '');
      const lng = parseFloat(t.lng ?? t.long ?? t.longitude ?? t.Lng ?? t.LNG ?? '');
      const valid = isFinite(lat) && isFinite(lng) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180;

      return {
        id: t.id ? String(t.id) : uid(),
        name: String(t.name ?? t.commonName ?? t.common_name ?? 'Untitled').trim(),
        species: String(t.species ?? t.scientificName ?? t.scientific_name ?? '').trim(),
        tag: String(t.tag ?? t.type ?? 'tree').trim().toLowerCase(),
        condition: String(t.condition ?? t.status ?? 'unknown').trim().toLowerCase(),
        location: String(t.location ?? t.locationNotes ?? t.location_notes ?? '').trim(),
        description: String(t.description ?? t.notes ?? t.learn ?? '').trim(),
        photo: String(t.photo ?? t.photoUrl ?? t.photo_url ?? t.image ?? '').trim(),
        lat: valid ? lat : null,
        lng: valid ? lng : null,
        createdAt: t.createdAt || t.created_at || new Date().toISOString(),
        updatedAt: t.updatedAt || t.updated_at || new Date().toISOString()
      };
    }

    function safePhotoUrl(url) {
      url = String(url || '').trim();
      if (!url) return '';
      if (/^javascript:/i.test(url)) return '';
      if (/^data:(?!image\/(png|jpe?g|gif|webp|avif))/i.test(url)) return '';
      return url;
    }

    function googleMapsUrl(lat, lng) {
      return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(lat)},${encodeURIComponent(lng)}`;
    }

    function appleMapsUrl(lat, lng) {
      return `https://maps.apple.com/?daddr=${encodeURIComponent(lat)},${encodeURIComponent(lng)}&dir=fl`;
    }

    function tagEmoji(tag) {
      return {
        palm: '🌴',
        conifer: '🌲',
        broadleaf: '🌳',
        tree: '🌳',
        shrub: '🌿',
        vine: '🍃',
        fern: '🌿',
        other: '🌱'
      }[tag] || '🌳';
    }

    function makeIcon(tree) {
      return L.divIcon({
        className: 'tree-div-icon',
        html: `<div class="tree-pin">${tagEmoji(tree.tag)}</div>`,
        iconSize: [30, 30],
        iconAnchor: [15, 15],
        popupAnchor: [0, -14]
      });
    }

    function makePopupElement(tree) {
      const el = document.createElement('div');
      el.className = 'popup';
      const photo = safePhotoUrl(tree.photo);

      el.innerHTML = `
        <h3>${escapeHtml(tree.name)}</h3>
        <div class="species">${escapeHtml(tree.species || 'Species not recorded')}</div>
        <div class="badges">
          <span class="badge">${escapeHtml(tree.tag || 'tree')}</span>
          <span class="badge badge-condition-${escapeHtml(tree.condition || 'unknown')}">${escapeHtml(tree.condition || 'unknown')}</span>
        </div>
        ${tree.location ? `<p class="loc"><strong>Location:</strong> ${escapeHtml(tree.location)}</p>` : ''}
        ${photo ? `<img src="${escapeHtml(photo)}" alt="${escapeHtml(tree.name)}" loading="lazy" referrerpolicy="no-referrer">` : ''}
        ${tree.description ? `<p class="desc">${escapeHtml(tree.description)}</p>` : ''}
        <div class="coords">${tree.lat.toFixed(6)}, ${tree.lng.toFixed(6)}</div>
        <div class="actions">
          <a class="btn btn-small" href="${googleMapsUrl(tree.lat, tree.lng)}" target="_blank" rel="noopener">Google Maps</a>
          <a class="btn btn-small" href="${appleMapsUrl(tree.lat, tree.lng)}" target="_blank" rel="noopener">Apple Maps</a>
        </div>
      `;
      return el;
    }

    function makeCardElement(tree) {
      const card = document.createElement('article');
      card.className = 'tree-card';

      const adminActions = adminMode ? `
        <button type="button" class="btn btn-small" data-action="edit">Edit</button>
        <button type="button" class="btn btn-small btn-danger" data-action="delete">Delete</button>
      ` : '';

      card.innerHTML = `
        <div class="card-head">
          <div>
            <h3>${escapeHtml(tree.name)}</h3>
            <div class="species">${escapeHtml(tree.species || 'Species not recorded')}</div>
          </div>
          <div class="badges">
            <span class="badge">${escapeHtml(tree.tag || 'tree')}</span>
            <span class="badge badge-condition-${escapeHtml(tree.condition || 'unknown')}">${escapeHtml(tree.condition || 'unknown')}</span>
          </div>
        </div>
        ${tree.location ? `<div class="loc">${escapeHtml(tree.location)}</div>` : ''}
        <div class="actions">
          <button type="button" class="btn btn-small" data-action="view">View</button>
          <a class="btn btn-small" href="${googleMapsUrl(tree.lat, tree.lng)}" target="_blank" rel="noopener">Google</a>
          <a class="btn btn-small" href="${appleMapsUrl(tree.lat, tree.lng)}" target="_blank" rel="noopener">Apple</a>
          ${adminActions}
        </div>
      `;

      card.querySelectorAll('[data-action]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const action = btn.dataset.action;
          if (action === 'view') {
            map.setView([tree.lat, tree.lng], Math.max(map.getZoom(), 18));
            const marker = markers.get(tree.id);
            if (marker) marker.openPopup();
          } else if (action === 'edit') {
            if (!adminMode) {
              alert('Turn on Admin mode in the footer to edit trees.');
              return;
            }
            showForm(tree);
          } else if (action === 'delete') {
            if (!adminMode) return;
            if (confirm(`Delete "${tree.name}"?`)) {
              supabase.from('trees').delete().eq('id', tree.id).then(({ error }) => {
                if (error) {
                  alert('Delete failed: ' + error.message);
                  return;
                }
                loadPublished().then(refreshDisplayed);
              });
            }
          }
        });
      });

      return card;
    }

    async function loadPublished() {
      try {
        const { data, error } = await supabase.from('trees').select('*').order('name');
        if (error) throw error;
        publishedTrees = (data || []).map(normalizeTree);
      } catch (err) {
        console.error('Supabase load failed:', err);
        publishedTrees = DEFAULT_TREES.map(normalizeTree);
      }
    }

    function refreshDisplayed() {
      trees = publishedTrees;
      renderMarkers();
      renderList();
      updateAdminUI();
    }

    function updateAdminUI() {
      ['btnAdd', 'btnExport', 'btnImport', 'btnResetPublished'].forEach((id) => {
        $(id).classList.toggle('hidden', !adminMode);
      });
      $('adminToggle').textContent = adminMode ? 'Admin mode: on' : 'Admin mode: off';
    }

    function setAdminMode(value) {
      adminMode = value;
      refreshDisplayed();
    }

    function renderMarkers() {
      markers.forEach((marker) => marker.remove());
      markers.clear();

      trees
        .filter((tree) => tree.lat !== null && tree.lng !== null)
        .forEach((tree) => {
          const marker = L.marker([tree.lat, tree.lng], {
            icon: makeIcon(tree),
            riseOnHover: true,
            title: tree.name
          }).addTo(map);

          marker.bindPopup(makePopupElement(tree), {
            maxWidth: 280,
            className: 'tree-popup'
          });

          marker.on('click', () => {
            map.panTo([tree.lat, tree.lng]);
          });

          markers.set(tree.id, marker);
        });
    }

    function renderList() {
      const query = $('search').value.trim().toLowerCase();
      const listEl = $('list');
      listEl.innerHTML = '';

      const filtered = trees
        .filter((tree) => {
          if (!query) return true;
          return [tree.name, tree.species, tree.location, tree.description, tree.tag, tree.condition].join(' ').toLowerCase().includes(query);
        })
        .sort((a, b) => a.name.localeCompare(b.name));

      if (!filtered.length) {
        listEl.innerHTML = '<div class="empty">No trees found. In admin mode, use "Add Tree" to create a record.</div>';
        return;
      }

      filtered.forEach((tree) => {
        listEl.appendChild(makeCardElement(tree));
      });
    }

    function showForm(tree = null) {
      if (!adminMode) {
        alert('Turn on Admin mode in the footer to add or edit trees.');
        return;
      }

      editingId = tree ? tree.id : null;
      $('formTitle').textContent = tree ? 'Edit Tree' : 'Add Tree';
      $('fDelete').classList.toggle('hidden', !tree);

      $('fName').value = tree?.name || '';
      $('fSpecies').value = tree?.species || '';
      $('fTag').value = tree?.tag || 'tree';
      $('fCondition').value = tree?.condition || 'unknown';
      $('fLocation').value = tree?.location || '';
      $('fDescription').value = tree?.description || '';
      $('fPhoto').value = tree?.photo || '';
      $('fLat').value = tree?.lat ?? '';
      $('fLng').value = tree?.lng ?? '';

      $('viewList').classList.add('hidden');
      $('viewForm').classList.remove('hidden');

      setPicking(false);
      updatePreviewFromForm();

      if (tree) {
        map.setView([tree.lat, tree.lng], Math.max(map.getZoom(), 18));
      } else {
        map.setView(map.getCenter(), Math.max(map.getZoom(), config.zoom));
      }
    }

    function hideForm() {
      editingId = null;
      setPicking(false);
      removePreview();
      $('viewForm').classList.add('hidden');
      $('viewList').classList.remove('hidden');
      renderList();
    }

    function setPicking(value) {
      picking = value;
      $('pickerBanner').classList.toggle('hidden', !value);
    }

    function setPickingCoords(lat, lng) {
      $('fLat').value = lat;
      $('fLng').value = lng;
      updatePreviewFromForm();
      setPicking(false);
    }

    function updatePreviewFromForm() {
      const lat = parseFloat($('fLat').value);
      const lng = parseFloat($('fLng').value);

      if (isFinite(lat) && isFinite(lng) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180) {
        if (!previewMarker) {
          previewMarker = L.circleMarker([lat, lng], {
            radius: 5,
            color: '#14532d',
            fillColor: '#14532d',
            fillOpacity: 0.7
          }).addTo(map);
        } else {
          previewMarker.setLatLng([lat, lng]);
        }
      } else if (previewMarker) {
        previewMarker.remove();
        previewMarker = null;
      }
    }

    function removePreview() {
      if (previewMarker) {
        previewMarker.remove();
        previewMarker = null;
      }
    }

    async function saveForm() {
      if (!adminMode) return;

      const name = $('fName').value.trim();
      if (!name) {
        alert('Common name is required.');
        return;
      }

      const lat = parseFloat($('fLat').value);
      const lng = parseFloat($('fLng').value);
      if (!isFinite(lat) || !isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) {
        alert('Set a valid location. Use "Click Map to Set Location" or enter coordinates.');
        return;
      }

      const payload = {
        name,
        species: $('fSpecies').value.trim(),
        tag: $('fTag').value,
        condition: $('fCondition').value,
        location: $('fLocation').value.trim(),
        description: $('fDescription').value.trim(),
        photo: $('fPhoto').value.trim(),
        lat,
        lng
      };

      let error = null;
      if (editingId) {
        const result = await supabase.from('trees').update(payload).eq('id', editingId);
        error = result.error;
      } else {
        const result = await supabase.from('trees').insert(payload);
        error = result.error;
      }

      if (error) {
        alert('Save failed: ' + error.message);
        return;
      }

      await loadPublished();
      refreshDisplayed();
      hideForm();
    }

    async function deleteCurrentTree() {
      if (!adminMode || !editingId) return;
      const tree = publishedTrees.find((item) => item.id === editingId);
      if (!tree) return;

      if (confirm(`Delete "${tree.name}"?`)) {
        const { error } = await supabase.from('trees').delete().eq('id', tree.id);
        if (error) {
          alert('Delete failed: ' + error.message);
          return;
        }
        await loadPublished();
        refreshDisplayed();
        hideForm();
      }
    }

    function fitTrees() {
      const validTrees = trees.filter((tree) => tree.lat != null && tree.lng != null);
      if (!validTrees.length) {
        map.setView(config.center, config.zoom);
        return;
      }
      const bounds = L.latLngBounds(validTrees.map((tree) => [tree.lat, tree.lng]));
      map.fitBounds(bounds.pad(0.25));
    }

    function centerCampus() {
      map.setView(config.center, config.zoom);
    }

    function exportTrees() {
      const blob = new Blob([JSON.stringify({ trees: publishedTrees }, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'trees-export.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    function importTrees(event) {
      const file = event.target.files?.[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const data = JSON.parse(String(e.target?.result || '[]'));
          const imported = getTreeArray(data).map(normalizeTree).filter((tree) => tree.lat !== null && tree.lng !== null);
          if (!imported.length) {
            alert('No valid tree records were found in that file.');
            return;
          }

          const rows = imported.map((tree) => ({
            id: tree.id,
            name: tree.name,
            species: tree.species,
            tag: tree.tag,
            condition: tree.condition,
            location: tree.location,
            description: tree.description,
            photo: tree.photo,
            lat: tree.lat,
            lng: tree.lng
          }));

          const { error } = await supabase.from('trees').upsert(rows, { onConflict: 'id' });
          if (error) {
            alert('Import failed: ' + error.message);
            return;
          }

          await loadPublished();
          refreshDisplayed();
          hideForm();
        } catch (err) {
          alert('Import file is not valid JSON.');
          console.error(err);
        } finally {
          event.target.value = '';
        }
      };
      reader.readAsText(file);
    }

    async function resetPublished() {
      if (!confirm('Reset the local published list to the seeded sample data?')) return;
      const { error } = await supabase.from('trees').delete().neq('id', '');
      if (error) {
        alert('Reset failed: ' + error.message);
        return;
      }

      const rows = DEFAULT_TREES.map((tree) => ({
        id: tree.id,
        name: tree.name,
        species: tree.species,
        tag: tree.tag,
        condition: tree.condition,
        location: tree.location,
        description: tree.description,
        photo: tree.photo,
        lat: tree.lat,
        lng: tree.lng
      }));

      const insertResult = await supabase.from('trees').upsert(rows, { onConflict: 'id' });
      if (insertResult.error) {
        alert('Reset failed: ' + insertResult.error.message);
        return;
      }

      await loadPublished();
      refreshDisplayed();
    }

    // Initialize
    $('btnAdd').addEventListener('click', () => showForm());
    $('btnExport').addEventListener('click', exportTrees);
    $('btnImport').addEventListener('click', () => $('importFile').click());
    $('btnResetPublished').addEventListener('click', resetPublished);
    $('btnCenter').addEventListener('click', centerCampus);
    $('btnFit').addEventListener('click', fitTrees);
    $('adminToggle').addEventListener('click', () => setAdminMode(!adminMode));
    $('fSave').addEventListener('click', saveForm);
    $('fCancel').addEventListener('click', hideForm);
    $('fDelete').addEventListener('click', deleteCurrentTree);
    $('fPick').addEventListener('click', () => setPicking(true));
    $('search').addEventListener('input', renderList);
    $('importFile').addEventListener('change', importTrees);

    map.on('click', (event) => {
      if (picking) {
        setPickingCoords(event.latlng.lat, event.latlng.lng);
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && $('viewForm').classList.contains('hidden') === false) {
        hideForm();
      }
    });

    // Load data on startup
    loadPublished().then(() => {
      refreshDisplayed();
    });
  </script>
</body>
</html>
